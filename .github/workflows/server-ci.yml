name: Server and contracts
on:
  push:
    branches: [main, testing]
    paths-ignore: [repo.json, "packages/**", "images/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
        env:
          POSTGRES_USER: amorrp
          POSTGRES_PASSWORD: amorrp-local-only
          POSTGRES_DB: amorrp_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U amorrp -d amorrp_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      AMORRP_TEST_DATABASE: "Host=127.0.0.1;Port=55432;Database=amorrp_test;Username=amorrp;Password=amorrp-local-only"
      ConnectionStrings__Database: "Host=127.0.0.1;Port=55432;Database=amorrp_test;Username=amorrp;Password=amorrp-local-only"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate documentation
        run: |
          python -m pip install -r scripts/requirements-docs.lock.txt
          python scripts/check-docs.py
      - name: Verify container startup and migration failure handling
        run: python scripts/check-server-startup.py
      - name: Restore locked dependency graphs
        run: |
          dotnet restore src/AmorRP.Server/AmorRP.Server.csproj --locked-mode
          dotnet restore tests/AmorRP.Contracts.Tests/AmorRP.Contracts.Tests.csproj --locked-mode
          dotnet restore tests/AmorRP.Plugin.Tests/AmorRP.Plugin.Tests.csproj --locked-mode
          dotnet restore tests/AmorRP.Server.IntegrationTests/AmorRP.Server.IntegrationTests.csproj --locked-mode
          dotnet tool restore
      - name: Build and test
        run: |
          dotnet build src/AmorRP.Server/AmorRP.Server.csproj -c Release --no-restore
          dotnet test tests/AmorRP.Contracts.Tests -c Release --no-restore
          dotnet test tests/AmorRP.Plugin.Tests -c Release --no-restore
          dotnet test tests/AmorRP.Server.IntegrationTests -c Release --no-restore
          dotnet ef migrations has-pending-model-changes --project src/AmorRP.Server --no-build --configuration Release
      - name: Build server image
        run: docker build -f deploy/Dockerfile -t amorrp-server:m5 .
      - name: Publish server files
        run: dotnet publish src/AmorRP.Server -c Release --no-restore -r linux-x64 --self-contained false -o artifacts/server-linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AmorRP-server-linux-x64
          path: artifacts/server-linux-x64/
          if-no-files-found: error
          retention-days: 30
