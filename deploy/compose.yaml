name: amorrp-m0

services:
  database:
    image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    environment:
      POSTGRES_USER: amorrp
      POSTGRES_PASSWORD: amorrp-local-only
      POSTGRES_DB: amorrp
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amorrp -d amorrp"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: amorrp-server:m4
    command: ["--migrate"]
    environment:
      ConnectionStrings__Database: "Host=database;Database=amorrp;Username=amorrp;Password=amorrp-local-only"
    depends_on:
      database: {condition: service_healthy}

  server:
    image: amorrp-server:m4
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ConnectionStrings__Database: "Host=database;Database=amorrp;Username=amorrp;Password=amorrp-local-only"
      XivAuth__DurableEnabled: "${XivAuth__DurableEnabled:-false}"
      XivAuth__ClientId: "${XivAuth__ClientId:-}"
      XivAuth__ClientSecret: "${XivAuth__ClientSecret:-}"
      XivAuth__DurableCallbackUrl: "${XivAuth__DurableCallbackUrl:-}"
      SecretVault__ActiveKeyId: "${SecretVault__ActiveKeyId:-primary}"
      SecretVault__Keys__primary: "${SecretVault__Keys__primary:-}"
    depends_on:
      migrate: {condition: service_completed_successfully}

  test-database:
    profiles: ["test"]
    image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    environment:
      POSTGRES_USER: amorrp
      POSTGRES_PASSWORD: amorrp-local-only
      POSTGRES_DB: amorrp_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amorrp -d amorrp_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  database:
