components:
  securitySchemes:
    Session:
      type: http
      scheme: bearer
      description: Opaque character-bound access credential.
    LoginStart:
      type: apiKey
      in: header
      name: X-Login-Request-Credential
      description: Client-generated 256-bit random secret for this login start/retry only. Does not authenticate
        a character.
    LoginAttempt:
      type: apiKey
      in: header
      name: X-Login-Attempt-Credential
      description: Secret bound to one short-lived attempt; not a session.
  responses:
    Problem:
      description: RFC 9457-style error; see code/status conventions in API guide.
      headers:
        Retry-After:
          schema:
            type: string
          description: Present for rate limit/service unavailable when appropriate.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title: &id009
          type: string
          description: Plain text; named service limits and Unicode text-element checks also apply.
        status:
          type: integer
          format: int32
        detail: *id009
        code: *id009
        requestId: *id009
        errors:
          type: object
          additionalProperties:
            type: array
            items: *id009
      required:
      - type
      - title
      - status
      - code
      - requestId
      additionalProperties: true
    Character:
      type: object
      properties:
        id: *id002
        displayName: &id010
          type: string
          minLength: 1
          maxLength: 80
        homeWorldId:
          type: string
        homeWorldName: *id010
        verifiedAt: &id012
          type: string
          format: date-time
        status:
          type: string
          enum:
          - active
          - deletion_pending
      required:
      - id
      - displayName
      - homeWorldId
      - homeWorldName
      - verifiedAt
      - status
      additionalProperties: true
    PublicLimits:
      type: object
      properties:
        ownedGroups:
          type: integer
          format: int32
          minimum: 1
        joinedGroups:
          type: integer
          format: int32
          minimum: 1
        defaultLettersPerWeek:
          type: integer
          format: int32
          minimum: 0
        defaultPotionPoints:
          type: integer
          format: int32
          minimum: 0
        chatMessageTextElements:
          type: integer
          format: int32
          minimum: 1
        letterTitleTextElements:
          type: integer
          format: int32
          minimum: 1
        letterBodyTextElements:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 500
        maxPageSize:
          type: integer
          format: int32
          minimum: 1
        maxHoldingsPerCharacterGroup:
          type: integer
          format: int32
          minimum: 1
        maxTradeLinesPerSide:
          type: integer
          format: int32
          minimum: 1
        maxCreationQuantity:
          type: integer
          format: int32
          minimum: 1
        tradeLifetimeSeconds:
          type: integer
          format: int32
          minimum: 1
        resetWeekdayUtc:
          type: string
        resetTimeUtc:
          type: string
        maxRequestBytes:
          type: integer
          format: int32
          minimum: 1
        maxWeeklyPotionPoints:
          type: integer
          minimum: 0
        maxWeeklyLetters:
          type: integer
          minimum: 0
        maxActiveInvitationsPerGroup:
          type: integer
          minimum: 1
        ownershipProposalHours:
          type: integer
          minimum: 1
        maxCurrencyIconBytes:
          type: integer
          format: int32
          minimum: 1
          default: 262144
        maxCurrencyIconDimension:
          type: integer
          format: int32
          minimum: 1
          default: 128
        maxCategoriesPerGroup:
          type: integer
          format: int32
          minimum: 1
          default: 100
        maxDefinitionsPerGroup:
          type: integer
          format: int32
          minimum: 1
          default: 1000
        definitionNameTextElements:
          type: integer
          format: int32
          minimum: 1
          default: 80
        definitionDescriptionTextElements:
          type: integer
          format: int32
          minimum: 1
          default: 300
        maxGroupLogoBytes:
          type: integer
          minimum: 1024
          maximum: 2097152
          default: 2097152
        maxGroupLogoSourceDimension:
          type: integer
          default: 2048
        maxGroupLogoDimension:
          type: integer
          default: 512
      required:
      - ownedGroups
      - joinedGroups
      - defaultLettersPerWeek
      - defaultPotionPoints
      - chatMessageTextElements
      - letterTitleTextElements
      - letterBodyTextElements
      - maxPageSize
      - maxHoldingsPerCharacterGroup
      - maxTradeLinesPerSide
      - maxCreationQuantity
      - tradeLifetimeSeconds
      - resetWeekdayUtc
      - resetTimeUtc
      - maxRequestBytes
      additionalProperties: true
    ItemTypeInfo:
      type: object
      properties:
        id: *id009
        typeDataVersion: *id011
        canUse: *id001
        stackable: *id001
      required:
      - id
      - typeDataVersion
      - canUse
      - stackable
      additionalProperties: true
    Capabilities:
      type: object
      properties:
        apiVersion:
          type: string
        serverVersion:
          type: string
        minimumClientVersion:
          type: string
        maintenance: *id001
        message: *id009
        supportedTypes:
          type: array
          items:
            $ref: '#/components/schemas/ItemTypeInfo'
        grantableCapabilities:
          type: array
          items:
            type: string
        chatDestinationKinds:
          type: array
          items:
            type: string
        limits:
          $ref: '#/components/schemas/PublicLimits'
      required:
      - apiVersion
      - serverVersion
      - minimumClientVersion
      - maintenance
      - message
      - supportedTypes
      - grantableCapabilities
      - chatDestinationKinds
      - limits
      additionalProperties: true
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      required:
      - status
      additionalProperties: true
    LoginStart:
      type: object
      properties:
        displayName: *id010
        homeWorldId:
          type: string
          minLength: 1
        homeWorldName:
          type: string
          minLength: 1
          maxLength: 80
          description: Non-authoritative local world-name hint for first verification.
        knownCharacterId:
          type: string
          format: uuid
          nullable: true
          description: Saved internal character ID for stable-ID reauthentication.
      required:
      - displayName
      - homeWorldId
      - homeWorldName
      additionalProperties: false
    LoginAttemptCreated:
      type: object
      properties:
        attemptId: *id002
        authorizationUrl:
          type: string
          format: uri
        attemptCredential:
          type: string
          description: 'Secret: header only after creation, never logged.'
        expiresAt: *id012
        pollIntervalSeconds:
          type: integer
          format: int32
          minimum: 1
        pairingRequired:
          type: boolean
          description: Always true for durable login from server 0.0.6.2. False or absent is legacy/feasibility only; new durable clients reject it.
      required:
      - attemptId
      - authorizationUrl
      - attemptCredential
      - expiresAt
      - pollIntervalSeconds
      additionalProperties: true
    LoginExchangeRequest:
      type: object
      properties:
        pairingCode:
          type: string
          maxLength: 64
          writeOnly: true
          description: Browser-only one-time secret; 16 random hexadecimal characters. Spaces, hyphens and case differences are accepted. Never log or put in a URL. Included in the idempotency request hash.
      required:
      - pairingCode
      additionalProperties: false
    LoginAttemptStatus:
      type: object
      properties:
        attemptId: *id002
        status:
          type: string
          enum:
          - pending
          - verified
          - failed
          - cancelled
          - expired
        expiresAt: *id012
        failureCode:
          type: string
          nullable: true
      required:
      - attemptId
      - status
      - expiresAt
      - failureCode
      additionalProperties: true
      description: No session credentials or pairing codes in status response. Verified means browser approval only, not permission to redeem without pairing.
    SessionTokens:
      type: object
      properties:
        sessionId: *id002
        character:
          $ref: '#/components/schemas/Character'
        accessToken:
          type: string
        accessExpiresAt: *id012
        refreshToken:
          type: string
        refreshExpiresAt: *id012
      required:
      - sessionId
      - character
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
      additionalProperties: true
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
      additionalProperties: false
    SessionInfo:
      type: object
      properties:
        id: *id002
        createdAt: *id012
        lastUsedAt: *id012
        expiresAt: *id012
        isCurrent: *id001
      required:
      - id
      - createdAt
      - lastUsedAt
      - expiresAt
      - isCurrent
      additionalProperties: true
    Currency:
      type: object
      properties:
        id: *id002
        groupId: *id002
        name: *id010
        symbol:
          type: string
          maxLength: 16
          deprecated: true
          description: Legacy M2 text symbol; release UI renders the custom or bundled currency icon.
        iconAssetId:
          type: string
          format: uuid
          nullable: true
          description: M3 group-scoped asset reference; omitted by M2, null when no custom icon.
        version: *id011
      required:
      - id
      - groupId
      - name
      - symbol
      - version
      additionalProperties: true
    Balance:
      type: object
      properties:
        currencyId: *id002
        characterId: *id002
        owned: &id013
          type: string
          description: Nonnegative whole units, within signed 64-bit range.
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
        reserved: *id013
        available: *id013
        version: *id011
      required:
      - currencyId
      - characterId
      - owned
      - reserved
      - available
      - version
      additionalProperties: true
    GroupLogoUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: One static PNG/JPG/WebP; at most 2 MiB and 2048px per source side. Proportionally downscaled to at most 512x512 and 1 MiB PNG.
      required:
      - file
      additionalProperties: false
    CurrencyIconUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: One static PNG, JPEG/JPG or WebP; at most 128x128 pixels, recommended maximum encoded
            size 256 KiB. Actual format and resource bounds are verified before persistence.
      required:
      - file
      additionalProperties: false
    CurrencyEdit:
      type: object
      properties:
        name: *id010
        symbol:
          type: string
          maxLength: 16
          deprecated: true
          description: Legacy M2 compatibility field; custom image changes use the currency icon endpoint.
      required:
      - name
      - symbol
      additionalProperties: false
    CurrencyAdjustment:
      type: object
      properties:
        targetCharacterId: *id002
        delta:
          type: string
          description: Nonzero signed whole units, checked against signed 64-bit range.
          pattern: ^-?[1-9][0-9]*$
          maxLength: 20
        reason: &id014
          type: string
          minLength: 1
          maxLength: 500
      required:
      - targetCharacterId
      - delta
      - reason
      additionalProperties: false
    Group:
      type: object
      properties:
        id: *id002
        name: *id010
        description: *id009
        ownerCharacterId: *id002
        version: *id011
        currency:
          $ref: '#/components/schemas/Currency'
        myCapabilities:
          type: array
          items:
            type: string
        myTradingRestricted: *id001
        myBalance:
          $ref: '#/components/schemas/Balance'
        pendingOwnershipTransferId:
          type: string
          format: uuid
          nullable: true
        logoAssetId:
          type: string
          format: uuid
          nullable: true
        logoVersion:
          type: integer
          format: int32
          minimum: 1
          default: 1
      required:
      - id
      - name
      - description
      - ownerCharacterId
      - version
      - currency
      - myCapabilities
      - myTradingRestricted
      - myBalance
      - pendingOwnershipTransferId
      additionalProperties: true
    GroupCreate:
      type: object
      properties:
        name: *id010
        description:
          type: string
          maxLength: 300
        currencyName: *id010
        currencySymbol:
          type: string
          maxLength: 16
          deprecated: true
          description: Legacy M2 compatibility field; custom image changes use the currency icon endpoint.
        weeklyPotionPoints:
          type: integer
          format: int32
          minimum: 0
        weeklyLetters:
          type: integer
          format: int32
          minimum: 0
          default: 5
      required:
      - name
      - description
      - currencyName
      - currencySymbol
      - weeklyPotionPoints
      - weeklyLetters
      additionalProperties: false
    GroupEdit:
      type: object
      properties:
        name: *id010
        description:
          type: string
          maxLength: 300
      required:
      - name
      - description
      additionalProperties: false
    GroupDeletion:
      type: object
      properties:
        confirmName: *id010
      required:
      - confirmName
      additionalProperties: false
    JoinGroup:
      type: object
      properties:
        invitationCode:
          type: string
          minLength: 1
        acceptMemberVisibility:
          type: boolean
          enum:
          - true
      required:
      - invitationCode
      - acceptMemberVisibility
      additionalProperties: false
    PolicyValues:
      type: object
      properties:
        potionPoints:
          type: integer
          format: int32
          minimum: 0
        letters:
          type: integer
          format: int32
          minimum: 0
      required:
      - potionPoints
      - letters
      additionalProperties: true
    GroupPolicies:
      type: object
      properties:
        groupId: *id002
        version: *id011
        currentPeriodStart: *id012
        nextResetAt: *id012
        current:
          $ref: '#/components/schemas/PolicyValues'
        next:
          $ref: '#/components/schemas/PolicyValues'
      required:
      - groupId
      - version
      - currentPeriodStart
      - nextResetAt
      - current
      - next
      additionalProperties: true
    PolicyEdit:
      type: object
      properties:
        potionPoints:
          type: integer
          format: int32
          minimum: 0
        letters:
          type: integer
          format: int32
          minimum: 0
      required:
      - potionPoints
      - letters
      additionalProperties: false
      description: Schedules values for next server weekly period; no client-selected effective date.
    Member:
      type: object
      properties:
        character:
          $ref: '#/components/schemas/Character'
        status:
          type: string
          enum:
          - active
          - dormant
          - blocked
        isOwner: *id001
        capabilities:
          type: array
          items:
            type: string
        tradingRestricted: *id001
        version: *id011
        etag:
          type: string
          description: Server-supplied member concurrency token, also available in roster rows.
        description:
          type: string
          description: Group-specific plain text; at most 300 Unicode text elements. Empty when unset.
      required:
      - character
      - status
      - isOwner
      - capabilities
      - tradingRestricted
      - version
      - etag
      additionalProperties: true
    MemberCapabilities:
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
            description: Only server-discovered grantable action IDs.
        tradingAllowed:
          type: boolean
          nullable: true
          description: Optional positive trading permission. Omitted or null preserves the current setting; false cancels open trades and releases reservations in the same transaction. No reason is required.
      required:
      - capabilities
      additionalProperties: false
    MemberRestriction:
      type: object
      properties:
        restricted: *id001
        reason:
          type: string
          maxLength: 500
      required:
      - restricted
      - reason
      additionalProperties: false
    MemberRemoval:
      type: object
      properties:
        reason: *id014
      required:
      - reason
      additionalProperties: false
    InvitationCreate:
      type: object
      properties:
        expiresInHours:
          type: integer
          format: int32
          deprecated: true
          description: Accepted for legacy clients but ignored; invitations do not expire.
        maxUses:
          type: integer
          format: int32
          deprecated: true
          description: Accepted for legacy clients but ignored; invitations have unlimited uses.
      additionalProperties: false
    Invitation:
      type: object
      properties:
        id: *id002
        groupId: *id002
        expiresAt: *id012
        maxUses:
          type: integer
          format: int32
        used:
          type: integer
          format: int32
        revoked: *id001
      required:
      - id
      - groupId
      - expiresAt
      - maxUses
      - used
      - revoked
      additionalProperties: true
    InvitationCreated:
      type: object
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        invitationCode:
          type: string
          description: Nine-character case-insensitive secret returned once; stored as a hash. Valid until revoked.
      required:
      - invitation
      - invitationCode
      additionalProperties: true
    OwnershipProposal:
      type: object
      properties:
        recipientCharacterId: *id002
      required:
      - recipientCharacterId
      additionalProperties: false
    OwnershipTransfer:
      type: object
      properties:
        id: *id002
        groupId: *id002
        fromCharacterId: *id002
        toCharacterId: *id002
        status:
          type: string
          enum:
          - proposed
          - accepted
          - cancelled
          - expired
        expiresAt: *id012
      required:
      - id
      - groupId
      - fromCharacterId
      - toCharacterId
      - status
      - expiresAt
      additionalProperties: true
    Category:
      type: object
      properties:
        id: *id002
        groupId: *id002
        name: *id010
        allowedTypeIds:
          type: array
          items:
            type: string
        retired: *id001
        version: *id011
      required:
      - id
      - groupId
      - name
      - allowedTypeIds
      - retired
      - version
      additionalProperties: true
    CategoryEdit:
      type: object
      properties:
        name: *id010
        allowedTypeIds:
          type: array
          items:
            type: string
      required:
      - name
      - allowedTypeIds
      additionalProperties: false
    PotionData:
      type: object
      properties:
        creationCost:
          type: integer
          format: int32
          minimum: 1
        useMessage:
          type: string
          description: Literal message. Server enforces discovered 50-text-element default and tested
            game byte cap.
      required:
      - creationCost
      - useMessage
      additionalProperties: true
    Definition:
      type: object
      properties:
        id: *id002
        groupId: *id002
        typeId:
          type: string
        revision: *id011
        typeDataVersion: *id011
        name: *id010
        categoryId: *id002
        description: *id009
        enabled: *id001
        retired: *id001
        potion:
          $ref: '#/components/schemas/PotionData'
      required:
      - id
      - groupId
      - typeId
      - revision
      - typeDataVersion
      - name
      - categoryId
      - description
      - enabled
      - retired
      - potion
      additionalProperties: true
      description: Potion definitions are authored by the owner or a member authorized for items.potion.define; future types use versioned typed payloads.
    PotionDataWrite:
      type: object
      properties:
        creationCost:
          type: integer
          format: int32
          minimum: 1
        useMessage:
          type: string
          description: Literal text, bounded by discovered message limits.
      required:
      - creationCost
      - useMessage
      additionalProperties: false
    DefinitionWrite:
      type: object
      properties:
        typeId:
          type: string
          description: Only potion supported for definitions in 1.0.
        name: *id010
        categoryId: *id002
        description:
          type: string
          maxLength: 300
        enabled: *id001
        potion:
          $ref: '#/components/schemas/PotionDataWrite'
      required:
      - typeId
      - name
      - categoryId
      - description
      - enabled
      - potion
      additionalProperties: false
    Holding:
      type: object
      properties:
        id: *id002
        groupId: *id002
        characterId: *id002
        typeId:
          type: string
        name: *id010
        categoryId: *id002
        quantity:
          type: integer
          format: int32
          minimum: 0
        reserved:
          type: integer
          format: int32
          minimum: 0
        available:
          type: integer
          format: int32
          minimum: 0
        version: *id011
        definitionId:
          type: string
          format: uuid
          nullable: true
        definitionRevision:
          type: integer
          format: int32
          nullable: true
        letterId:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - groupId
      - characterId
      - typeId
      - name
      - categoryId
      - quantity
      - reserved
      - available
      - version
      - definitionId
      - definitionRevision
      - letterId
      additionalProperties: true
    Letter:
      type: object
      properties:
        id: *id002
        groupId: *id002
        author:
          $ref: '#/components/schemas/Character'
        categoryId: *id002
        title: *id010
        body: *id009
        version: *id011
        locked: *id001
        firstTradedAt:
          type: string
          format: date-time
          nullable: true
        typeId:
          type: string
          enum:
          - book
          - letter
          - note
      required:
      - id
      - groupId
      - author
      - categoryId
      - title
      - body
      - version
      - locked
      - firstTradedAt
      additionalProperties: true
    HoldingDetails:
      type: object
      properties:
        holding:
          $ref: '#/components/schemas/Holding'
        definition:
          $ref: '#/components/schemas/Definition'
        letter:
          $ref: '#/components/schemas/Letter'
      required:
      - holding
      additionalProperties: true
      description: Current holder only. Exactly one definition or letter payload applies in 1.0.
    Quota:
      type: object
      properties:
        kind:
          type: string
          description: potion_points or letters; extensible identifier.
        periodStart: *id012
        resetAt: *id012
        limit:
          type: integer
          format: int32
          minimum: 0
        used:
          type: integer
          format: int32
          minimum: 0
        remaining:
          type: integer
          format: int32
          minimum: 0
      required:
      - kind
      - periodStart
      - resetAt
      - limit
      - used
      - remaining
      additionalProperties: true
    Quotas:
      type: object
      properties:
        groupId: *id002
        characterId: *id002
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/Quota'
      required:
      - groupId
      - characterId
      - quotas
      additionalProperties: true
    PotionCreate:
      type: object
      properties:
        definitionId: *id002
        expectedDefinitionRevision: *id011
        quantity: &id015
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
      required:
      - definitionId
      - expectedDefinitionRevision
      - quantity
      additionalProperties: false
    LetterCreate:
      type: object
      properties:
        categoryId: *id002
        title: *id010
        body:
          type: string
          maxLength: 500
        typeId:
          type: string
          enum:
          - book
          - letter
          - note
          default: letter
      required:
      - categoryId
      - title
      - body
      additionalProperties: false
    LetterEdit:
      type: object
      properties:
        title: *id010
        body:
          type: string
          maxLength: 500
      required:
      - title
      - body
      additionalProperties: false
    ProductionResult:
      type: object
      properties:
        holding:
          $ref: '#/components/schemas/Holding'
        quota:
          $ref: '#/components/schemas/Quota'
      required:
      - holding
      - quota
      additionalProperties: true
    ConsumptionRequest:
      type: object
      properties:
        expectedHoldingVersion: *id011
        chatConsent:
          type: boolean
          description: Existing once-per-startup chat permission, automatically supplied by the client.
            Never requires a new per-message or per-use consent question.
          enum:
          - true
        destination:
          type: string
          description: emote, say, party, or a selected linkshell identifier; validate locally and server-side
            format.
      required:
      - expectedHoldingVersion
      - chatConsent
      - destination
      additionalProperties: false
    ConsumptionResult:
      type: object
      properties:
        holding:
          $ref: '#/components/schemas/Holding'
        message: *id009
        destination:
          type: string
        chatDelivery:
          type: string
          description: Server does not verify game delivery.
          enum:
          - client_action_required
      required:
      - holding
      - message
      - destination
      - chatDelivery
      additionalProperties: true
    DiscardRequest:
      type: object
      properties:
        quantity: *id015
        expectedHoldingVersion: *id011
      required:
      - quantity
      - expectedHoldingVersion
      additionalProperties: false
    InventoryRemoval:
