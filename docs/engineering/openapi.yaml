        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: Valid refresh credential; replay key protected
      x-implementation-status: implemented
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: UUIDv7. Same logical request retains key; see API guide for replay and age rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /api/v2/auth/sessions/current:
    delete:
      operationId: logout
      tags:
      - Authentication
      summary: Revoke current session and close its event connection
      security:
      - Session: []
      responses:
        '200':
