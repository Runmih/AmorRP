openapi: 3.0.3
info:
  title: Amor RP Seasons API
  version: 0.4.0.3
  description: Seasons are the sole shared economy model, with RP groups inside each season. Creation requires seasons.create.
    No community mode, enable flag, older-server fallback or old API aliases are exposed. The external XIVAuth provider
    uses its own API v1.
servers:
- url: https://api.example.invalid
  description: Placeholder; configure real trusted backend URL.
tags:
- name: Service
- name: Authentication
- name: Character
- name: Seasons
- name: Membership
- name: Ownership
- name: Currency
- name: Categories
- name: Definitions
- name: Inventory
- name: Trading
- name: History
- name: Recovery
- name: Data lifecycle
- name: Events
- name: Season Groups
paths:
  /api/v2/seasons/context:
    get:
      operationId: getSeasonContext
      tags:
      - Seasons
      summary: Active season and authenticated administrator capabilities
      security:
      - Session: []
      x-authorization-policy: Verified character session; lifecycle summaries are administrator-only
      x-implementation-status: implemented
      responses:
        '200':
          description: Enrolls a missing active-season membership without undoing moderation; returns authenticated
            season context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonContext'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v2/seasons/{seasonId}/activation:
    post:
      operationId: activateSeason
      tags:
      - Seasons
      summary: Activate a draft season and archive the current season
      security:
      - Session: []
      x-authorization-policy: Server-configured provider-verified Lodestone administrator allowlist; exact name
        and current ETag required
      x-implementation-status: implemented
      parameters:
      - name: seasonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonTransition'
      responses:
        '200':
          description: Durable lifecycle receipt; exactly one active season, fresh membership enrollment and no
            cross-season transfers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonTransitionResult'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /api/v2/seasons/{seasonId}/archive:
    post:
      operationId: archiveSeason
      tags:
      - Seasons
      summary: Freeze the active season without deleting its assets or records
      security:
      - Session: []
      x-authorization-policy: Server-configured provider-verified Lodestone administrator allowlist; exact name
        and current ETag required
      x-implementation-status: implemented
      parameters:
      - name: seasonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonTransition'
      responses:
        '200':
          description: Durable lifecycle receipt; open trades cancelled, reservations released, archive retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonTransitionResult'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - Service
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Process liveness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
      x-authorization-policy: Public
      x-implementation-status: implemented
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - Service
      summary: Cached database and startup readiness; failure uses 503
      description: One background probe per process, refreshed 5 seconds after completion by default. Initially
        unavailable; HTTP requests never initiate database probes. Responses use Cache-Control no-store.
      security: []
      responses:
        '200':
          description: Latest successful background readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      x-authorization-policy: Public
      x-implementation-status: implemented
  /api/v2/capabilities:
    get:
      operationId: getCapabilities
      tags:
      - Service
      summary: Versions, maintenance, types, permissions and public limits
      security: []
      responses:
        '200':
          description: Versions, maintenance, types, permissions and public limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: Public
      x-implementation-status: implemented
  /api/v2/auth/login-attempts:
    post:
      operationId: startLogin
      tags:
      - Authentication
      summary: Start browser character login
      security:
      - LoginStart: []
      responses:
        '201':
          description: Start browser character login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLoginResult'
          headers:
            Idempotency-Replayed:
              schema: &id001
                type: boolean
              description: True means original response; never automatically repeat chat.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: Public bootstrap; secret retry credential; rate limited
      x-implementation-status: implemented
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: UUIDv7. Same logical request retains key; see API guide for replay and age rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginStart'
  /api/v2/auth/login-attempts/{attemptId}:
    get:
      operationId: getLoginStatus
      tags:
      - Authentication
      summary: Poll login status without session secrets
      security:
      - LoginAttempt: []
      responses:
        '200':
          description: Poll login status without session secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttemptStatus'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: LoginAttempt
      x-implementation-status: implemented
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
    delete:
      operationId: cancelLogin
      tags:
      - Authentication
      summary: Cancel own pending login attempt
      security:
      - LoginAttempt: []
      responses:
        '200':
          description: Cancel own pending login attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          headers:
            Idempotency-Replayed:
              schema: *id001
              description: True means original response; never automatically repeat chat.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: LoginAttempt
      x-implementation-status: implemented
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id002
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: UUIDv7. Same logical request retains key; see API guide for replay and age rules.
  /api/v2/auth/login-attempts/{attemptId}/exchange:
    post:
      operationId: exchangeLogin
      tags:
      - Authentication
      summary: Pair verified browser approval and redeem once for session
      security:
      - LoginAttempt: []
      description: Requires both the attempt credential and the one-time code displayed only on the verified browser
        page. Approval or polling alone cannot redeem. Five incorrect guesses by default permanently fail that attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginExchangeRequest'
      responses:
        '200':
          description: Pair verified browser approval and redeem once for session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeLoginResult'
          headers:
            Idempotency-Replayed:
              schema: *id001
              description: True means original response; never automatically repeat chat.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: LoginAttempt
      x-implementation-status: implemented
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id002
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: UUIDv7. Same logical request retains key; see API guide for replay and age rules.
  /auth/xivauth/callback:
    get:
      operationId: xivauthCallback
      tags:
      - Authentication
      summary: Registered browser OAuth callback
      security: []
      responses:
        '200':
          description: Registered browser OAuth callback
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Login failure page; retained HTTP failure status and no automatic closure.
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          description: Login failure page; retained HTTP failure status and no automatic closure.
          content:
            text/html:
              schema:
                type: string
      x-authorization-policy: Exact callback; one-use state; provider exchange
      x-implementation-status: implemented
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      description: Noncached HTML status only; no session tokens or provider errors rendered to browser. Successful
        verification attempts tab closure after eight seconds with keep-open/manual-close controls and a browser-blocked
        fallback. Failures stay open. Nonced same-origin assets only. The page removes the OAuth query from its
        history entry. code or error follows actual provider contract.
  /auth/assets/login-background-{contentHash}.jpg:
    get:
      operationId: loginBackground
      tags:
      - Authentication
      summary: Bundled public login wallpaper
      security: []
      x-authorization-policy: Public; exact current image hash only
      x-implementation-status: implemented
      parameters:
      - name: contentHash
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{12}$
        description: First twelve hexadecimal characters of the bundled image SHA-256.
      responses:
        '200':
          description: Public JPEG with immutable cache headers and a content ETag.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: Image unchanged for the supplied cache validator.
        '404':
          description: No bundled image matches this hash.
  /api/v2/auth/sessions/refresh:
    post:
      operationId: refreshSession
      tags:
