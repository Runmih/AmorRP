openapi: 3.0.3
info:
  title: Amor RP proposed 1.0 API
  version: 1.0.0-draft
  description: API v1 with per-operation status. M4 implements durable authentication, groups, currency/icons,
    potion and Books inventory, weekly quotas, CRUD membership/removal and persistent trading. Events
    and data lifecycle remain planned for M5.
servers:
- url: https://api.example.invalid
  description: Placeholder; configure real trusted backend URL.
tags:
- name: Service
- name: Authentication
- name: Character
- name: Groups
- name: Membership
- name: Invitations
- name: Ownership
- name: Currency
- name: Categories
- name: Definitions
- name: Inventory
- name: Trading
- name: History
- name: Recovery
- name: Data lifecycle
- name: Events
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - Service
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Process liveness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
      x-authorization-policy: Public
      x-implementation-status: implemented
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - Service
      summary: Cached database and startup readiness; failure uses 503
      description: One background probe per process, refreshed 5 seconds after completion by default. Initially unavailable; HTTP requests never initiate database probes. Responses use Cache-Control no-store.
      security: []
      responses:
        '200':
          description: Latest successful background readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      x-authorization-policy: Public
      x-implementation-status: implemented
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags:
      - Service
      summary: Versions, maintenance, types, permissions and public limits
      security: []
      responses:
        '200':
          description: Versions, maintenance, types, permissions and public limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          headers:
            ETag:
              schema:
                type: string
              description: Resource concurrency token where versioned.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: Public
      x-implementation-status: implemented
  /api/v1/auth/login-attempts:
    post:
      operationId: startLogin
      tags:
      - Authentication
      summary: Start browser character login
      security:
      - LoginStart: []
      responses:
        '201':
          description: Start browser character login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLoginResult'
          headers:
            Idempotency-Replayed:
              schema: &id001
                type: boolean
              description: True means original response; never automatically repeat chat.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
