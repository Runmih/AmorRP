  /auth/xivauth/callback:
    get:
      operationId: xivauthCallback
      tags:
      - Authentication
      summary: Registered browser OAuth callback
      security: []
      responses:
        '200':
          description: Registered browser OAuth callback
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Login failure page; retained HTTP failure status and no automatic closure.
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          description: Login failure page; retained HTTP failure status and no automatic closure.
          content:
            text/html:
              schema:
                type: string
      x-authorization-policy: Exact callback; one-use state; provider exchange
      x-implementation-status: implemented
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      description: Noncached HTML status only; no session tokens or provider errors rendered to browser.
        Successful verification attempts tab closure after eight seconds with keep-open/manual-close
        controls and a browser-blocked fallback. Failures stay open. Nonced same-origin assets only.
        The page removes the OAuth query from its history entry. code or error follows actual provider contract.
  /auth/assets/login-background-{contentHash}.jpg:
    get:
      operationId: loginBackground
      tags:
      - Authentication
      summary: Bundled public login wallpaper
      security: []
      x-authorization-policy: Public; exact current image hash only
      x-implementation-status: implemented
      parameters:
      - name: contentHash
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{12}$'
        description: First twelve hexadecimal characters of the bundled image SHA-256.
      responses:
        '200':
          description: Public JPEG with immutable cache headers and a content ETag.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: Image unchanged for the supplied cache validator.
        '404':
          description: No bundled image matches this hash.
