components:
  securitySchemes:
    Session:
      type: http
      scheme: bearer
      description: Opaque character-bound access credential.
    LoginStart:
      type: apiKey
      in: header
      name: X-Login-Request-Credential
      description: Client-generated 256-bit random secret for this login start/retry only. Does not authenticate
        a character.
    LoginAttempt:
      type: apiKey
      in: header
      name: X-Login-Attempt-Credential
      description: Secret bound to one short-lived attempt; not a session.
  responses:
    Problem:
      description: RFC 9457-style error; see code/status conventions in API guide.
      headers:
        Retry-After:
          schema:
            type: string
          description: Present for rate limit/service unavailable when appropriate.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SeasonSummary:
      type: object
      required:
      - id
      - name
      - state
      - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
          enum:
          - draft
          - active
          - archived
        version:
          type: integer
          minimum: 1
    SeasonContext:
      type: object
      required:
      - isAdministrator
      - activeSeasonId
      - seasons
      - myCapabilities
      properties:
        isAdministrator:
          type: boolean
        activeSeasonId:
          type: string
          format: uuid
          nullable: true
        seasons:
          type: array
          description: Administrator lifecycle metadata only; never grants private group access
          items:
            $ref: '#/components/schemas/SeasonSummary'
        myCapabilities:
          type: array
          items:
            type: string
            enum:
            - seasons.create
    SeasonTransition:
      type: object
      required:
      - confirmName
      properties:
        confirmName:
          type: string
          maxLength: 80
    SeasonTransitionResult:
      type: object
      required:
      - operationId
      - result
      properties:
        operationId:
          type: string
          format: uuid
        result:
          $ref: '#/components/schemas/SeasonSummary'
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title: &id008
          type: string
          description: Plain text; named service limits and Unicode text-element checks also apply.
        status:
          type: integer
          format: int32
        detail: *id008
        code: *id008
        requestId: *id008
        errors:
          type: object
          additionalProperties:
            type: array
            items: *id008
      required:
      - type
      - title
      - status
      - code
      - requestId
      additionalProperties: true
    Character:
      type: object
      properties:
        id: *id002
        displayName: &id009
          type: string
          minLength: 1
          maxLength: 80
        homeWorldId:
          type: string
        homeWorldName: *id009
        verifiedAt: &id011
          type: string
          format: date-time
        status:
          type: string
          enum:
          - active
          - deletion_pending
      required:
      - id
      - displayName
      - homeWorldId
      - homeWorldName
      - verifiedAt
      - status
      additionalProperties: true
    PublicLimits:
      type: object
      properties:
        defaultLettersPerWeek:
          type: integer
          format: int32
          minimum: 0
        defaultPotionPoints:
          type: integer
          format: int32
          minimum: 0
        chatMessageTextElements:
          type: integer
          format: int32
          minimum: 1
        letterTitleTextElements:
          type: integer
          format: int32
          minimum: 1
        letterBodyTextElements:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 500
        maxPageSize:
          type: integer
          format: int32
          minimum: 1
        maxHoldingsPerCharacterCommunity:
          type: integer
          format: int32
          minimum: 1
        maxTradeLinesPerSide:
          type: integer
          format: int32
          minimum: 1
        maxCreationQuantity:
          type: integer
          format: int32
          minimum: 1
        tradeLifetimeSeconds:
          type: integer
          format: int32
          minimum: 1
        resetWeekdayUtc:
          type: string
        resetTimeUtc:
          type: string
        maxRequestBytes:
          type: integer
          format: int32
          minimum: 1
        maxWeeklyPotionPoints:
          type: integer
          minimum: 0
        maxWeeklyLetters:
          type: integer
          minimum: 0
        ownershipProposalHours:
          type: integer
          minimum: 1
        maxCurrencyIconBytes:
          type: integer
          format: int32
          minimum: 1
          default: 262144
        maxCurrencyIconDimension:
          type: integer
          format: int32
          minimum: 1
          default: 128
        maxCategoriesPerCommunity:
          type: integer
          format: int32
          minimum: 1
          default: 100
        maxDefinitionsPerCommunity:
          type: integer
          format: int32
          minimum: 1
          default: 1000
        definitionNameTextElements:
          type: integer
          format: int32
          minimum: 1
          default: 80
        definitionDescriptionTextElements:
          type: integer
          format: int32
          minimum: 1
          default: 300
        maxCommunityLogoBytes:
          type: integer
          minimum: 1024
          maximum: 2097152
          default: 2097152
        maxCommunityLogoSourceDimension:
          type: integer
          default: 2048
        maxCommunityLogoDimension:
          type: integer
          default: 512
      required:
      - defaultLettersPerWeek
      - defaultPotionPoints
      - chatMessageTextElements
      - letterTitleTextElements
      - letterBodyTextElements
      - maxPageSize
      - maxHoldingsPerCharacterCommunity
      - maxTradeLinesPerSide
      - maxCreationQuantity
      - tradeLifetimeSeconds
      - resetWeekdayUtc
      - resetTimeUtc
      - maxRequestBytes
      additionalProperties: true
    ItemTypeInfo:
      type: object
      properties:
        id: *id008
        typeDataVersion: *id010
        canUse: *id001
        stackable: *id001
      required:
      - id
      - typeDataVersion
      - canUse
      - stackable
      additionalProperties: true
    Capabilities:
      type: object
      properties:
        apiVersion:
          type: string
        serverVersion:
          type: string
        minimumClientVersion:
          type: string
        maintenance: *id001
        message: *id008
        supportedTypes:
          type: array
          items:
            $ref: '#/components/schemas/ItemTypeInfo'
        grantableCapabilities:
          type: array
          items:
            type: string
        chatDestinationKinds:
          type: array
          items:
            type: string
        limits:
          $ref: '#/components/schemas/PublicLimits'
      required:
      - apiVersion
      - serverVersion
      - minimumClientVersion
      - maintenance
      - message
      - supportedTypes
      - grantableCapabilities
      - chatDestinationKinds
      - limits
      additionalProperties: true
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      required:
      - status
      additionalProperties: true
    LoginStart:
      type: object
      properties:
        displayName: *id009
        homeWorldId:
          type: string
          minLength: 1
        homeWorldName:
          type: string
          minLength: 1
          maxLength: 80
          description: Non-authoritative local world-name hint for first verification.
        knownCharacterId:
          type: string
          format: uuid
          nullable: true
          description: Saved internal character ID for stable-ID reauthentication.
      required:
      - displayName
      - homeWorldId
      - homeWorldName
      additionalProperties: false
    LoginAttemptCreated:
      type: object
      properties:
        attemptId: *id002
        authorizationUrl:
          type: string
          format: uri
        attemptCredential:
          type: string
          description: 'Secret: header only after creation, never logged.'
        expiresAt: *id011
        pollIntervalSeconds:
          type: integer
          format: int32
          minimum: 1
        pairingRequired:
          type: boolean
          description: Always true for durable login from server 0.0.6.2. False or absent is legacy/feasibility
            only; new durable clients reject it.
      required:
      - attemptId
      - authorizationUrl
      - attemptCredential
      - expiresAt
      - pollIntervalSeconds
      additionalProperties: true
    LoginExchangeRequest:
      type: object
      properties:
        pairingCode:
          type: string
          maxLength: 64
          writeOnly: true
          description: Browser-only one-time secret; 16 random hexadecimal characters. Spaces, hyphens and case
            differences are accepted. Never log or put in a URL. Included in the idempotency request hash.
      required:
      - pairingCode
      additionalProperties: false
    LoginAttemptStatus:
      type: object
      properties:
        attemptId: *id002
        status:
          type: string
          enum:
          - pending
          - verified
          - failed
          - cancelled
          - expired
        expiresAt: *id011
        failureCode:
          type: string
          nullable: true
      required:
      - attemptId
      - status
      - expiresAt
      - failureCode
      additionalProperties: true
      description: No session credentials or pairing codes in status response. Verified means browser approval only,
        not permission to redeem without pairing.
    SessionTokens:
      type: object
      properties:
        sessionId: *id002
        character:
          $ref: '#/components/schemas/Character'
        accessToken:
          type: string
        accessExpiresAt: *id011
        refreshToken:
          type: string
        refreshExpiresAt: *id011
      required:
      - sessionId
      - character
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
      additionalProperties: true
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
      additionalProperties: false
    SessionInfo:
      type: object
      properties:
        id: *id002
        createdAt: *id011
        lastUsedAt: *id011
        expiresAt: *id011
        isCurrent: *id001
      required:
      - id
      - createdAt
      - lastUsedAt
      - expiresAt
      - isCurrent
      additionalProperties: true
    Currency:
      type: object
      properties:
        id: *id002
        seasonId: *id002
        name: *id009
        symbol:
          type: string
          maxLength: 16
          deprecated: true
          description: Legacy M2 text symbol; release UI renders the custom or bundled currency icon.
        iconAssetId:
          type: string
          format: uuid
          nullable: true
          description: M3 season-scoped asset reference; omitted by M2, null when no custom icon.
        version: *id010
      required:
      - id
      - seasonId
      - name
      - symbol
      - version
      additionalProperties: true
    Balance:
      type: object
      properties:
        heldForDebt:
          type: string
          default: '0'
        currencyId: *id002
        characterId: *id002
        owned: &id012
          type: string
          description: Nonnegative whole units, within signed 64-bit range.
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
        reserved: *id012
        available: *id012
        version: *id010
      required:
      - currencyId
      - characterId
      - owned
      - reserved
      - available
      - version
      additionalProperties: true
    SeasonLogoUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: One static PNG/JPG/WebP; at most 2 MiB and 2048px per source side. Proportionally downscaled
