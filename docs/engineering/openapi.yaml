                $ref: '#/components/schemas/Receipt'
          headers:
            Idempotency-Replayed:
              schema: *id001
              description: True means original response; never automatically repeat chat.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-authorization-policy: LoginAttempt
      x-implementation-status: implemented
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id002
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: UUIDv7. Same logical request retains key; see API guide for replay and age rules.
  /api/v1/auth/login-attempts/{attemptId}/exchange:
    post:
      operationId: exchangeLogin
      tags:
      - Authentication
      summary: Pair verified browser approval and redeem once for session
      security:
      - LoginAttempt: []
      description: Requires both the attempt credential and the one-time code displayed only on the verified browser page. Approval or polling alone cannot redeem. Five incorrect guesses by default permanently fail that attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginExchangeRequest'
      responses:
        '200':
          description: Pair verified browser approval and redeem once for session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeLoginResult'
          headers:
            Idempotency-Replayed:
              schema: *id001
              description: True means original response; never automatically repeat chat.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
